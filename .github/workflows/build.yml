name: Build
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && ./gradlew buildAndCollect
      - name: List jars
        if: always()
        run: find . -name "*.jar" -not -path "./.gradle/*" -not -path "./gradle/*" | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jars
          path: build/libs
          if-no-files-found: error
